name: AFC Early Info Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: afc-early-info-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Restore sent news
        uses: actions/cache/restore@v4
        with:
          path: |
            seen_news.txt
            afc_press_seen.json
          key: afc-seen-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            afc-seen-v1-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AFC Early Info
        timeout-minutes: 12
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_ENABLED: ${{ vars.AI_ENABLED }}
          AI_MIN_SCORE: "9"
          AI_MAX_CALLS_PER_RUN: "10"
        run: |
          set -euo pipefail
          python -u bot.py 2>&1 | tee afc_search.log

      - name: Save search diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afc-search-diagnostics
          path: |
            afc_search_diagnostics.json
            afc_search.log
          retention-days: 7
          if-no-files-found: warn

      - name: Save sent news
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            seen_news.txt
            afc_press_seen.json
          key: afc-seen-v1-${{ github.run_id }}-${{ github.run_attempt }}
