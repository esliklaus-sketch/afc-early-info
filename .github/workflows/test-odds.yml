name: Test Football Odds

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  actions: read

jobs:
  test-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Capture current odds
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python test_odds.py

      - name: Download previous successful odds snapshot
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'test-odds.yml', status: 'success', per_page: 30
            });
            for (const run of runs) {
              if (run.id === context.runId) continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner, repo, run_id: run.id, per_page: 100
              });
              const artifact = artifacts.find(a => a.name === 'odds-snapshot' && !a.expired);
              if (!artifact) continue;
              const download = await github.rest.actions.downloadArtifact({
                owner, repo, artifact_id: artifact.id, archive_format: 'zip'
              });
              fs.writeFileSync('previous_odds.zip', Buffer.from(download.data));
              core.setOutput('found', 'true');
              core.info(`Previous snapshot from run ${run.id}`);
              return;
            }
            core.setOutput('found', 'false');
            core.info('No previous snapshot found; comparison skipped for this run.');

      - name: Compare odds with previous snapshot
        if: steps.previous.outputs.found == 'true'
        run: |
          current_file=$(find data -maxdepth 1 -name 'odds_*.json' -type f | sort | tail -n 1)
          test -n "$current_file"
          python compare_odds.py previous_odds.zip "$current_file" --min-change 0 | tee odds_comparison.txt

      - name: Upload odds snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds-snapshot
          path: data/odds_*.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload comparison report
        if: steps.previous.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: odds-comparison
          path: odds_comparison.txt
          if-no-files-found: warn
          retention-days: 30
