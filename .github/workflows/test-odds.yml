name: Test Football Odds

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: test-football-odds
  cancel-in-progress: false

jobs:
  test-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests 'openai>=1.68,<3'

      - name: Restore prediction history
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: 'test-odds.yml',
                per_page: 30
              }
            );

            runs.sort((a, b) => b.id - a.id);

            for (const run of runs) {
              if (run.id === context.runId) continue;
              if (run.status !== 'completed') continue;

              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                {
                  owner,
                  repo,
                  run_id: run.id,
                  per_page: 100
                }
              );

              const artifact = artifacts.find(
                a => a.name === 'prediction-history' && !a.expired
              );

              if (!artifact) continue;

              const download = await github.rest.actions.downloadArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
                archive_format: 'zip'
              });

              fs.writeFileSync(
                'prediction_history.zip',
                Buffer.from(download.data)
              );

              core.info(`History restored from run ${run.id}`);
              return;
            }

            core.info('No saved history found; starting a new ledger.');

      - name: Extract prediction history
        run: |
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          archive = Path("prediction_history.zip")

          if archive.exists():
              with zipfile.ZipFile(archive) as z:
                  names = [
                      name for name in z.namelist()
                      if Path(name).name == "prediction_tracking.json"
                  ]
                  if len(names) != 1:
                      raise RuntimeError("Invalid prediction history archive")

                  payload = z.read(names[0])
                  state = json.loads(payload)

                  if state.get("schema_version") != 1:
                      raise RuntimeError("Unsupported history schema")

                  if not isinstance(state.get("predictions"), dict):
                      raise RuntimeError("Invalid prediction ledger")

                  target = Path("data/prediction_tracking.json")
                  target.parent.mkdir(exist_ok=True)
                  target.write_bytes(payload)

                  print(f"Restored {len(state['predictions'])} records")
          else:
              print("First run: no previous history archive")
          PY

      - name: Analyze current and previous seasons
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python analyze_leagues.py

      - name: Capture current odds
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python test_odds.py

      - name: Run experimental value model
        run: |
          set -euo pipefail
          python value_model.py | tee value_model_report.txt

      - name: Review value candidates with AI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python value_ai_review.py

      - name: Track and settle predictions
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -euo pipefail
          python track_predictions.py | tee prediction_tracking_report.txt
      - name: Send value test messages to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_VALUE_CHAT_ID: ${{ secrets.TELEGRAM_VALUE_CHAT_ID }}
        run: python send_value_telegram.py

      - name: Backtest model probabilities
        run: |
          set -euo pipefail
          python backtest_model.py | tee backtest_report.txt

      - name: Compare model candidates
        run: |
          set -euo pipefail
          python model_candidates.py | tee model_candidates_report.txt

      - name: Download previous successful odds snapshot
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: 'test-odds.yml',
                status: 'success',
                per_page: 30
              }
            );

            runs.sort((a, b) => b.id - a.id);

            for (const run of runs) {
              if (run.id === context.runId) continue;

              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                {
                  owner,
                  repo,
                  run_id: run.id,
                  per_page: 100
                }
              );

              const artifact = artifacts.find(
                a => a.name === 'odds-snapshot' && !a.expired
              );

              if (!artifact) continue;

              const download = await github.rest.actions.downloadArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
                archive_format: 'zip'
              });

              fs.writeFileSync(
                'previous_odds.zip',
                Buffer.from(download.data)
              );

              core.setOutput('found', 'true');
              core.info(`Previous snapshot from run ${run.id}`);
              return;
            }

            core.setOutput('found', 'false');
            core.info('No previous snapshot found; comparison skipped.');

      - name: Compare odds with previous snapshot
        if: steps.previous.outputs.found == 'true'
        run: |
          set -euo pipefail
          current_file=$(find data -maxdepth 1 -name 'odds_*.json' -type f | sort | tail -n 1)
          test -n "$current_file"
          python compare_odds.py previous_odds.zip "$current_file" --min-change 0 | tee odds_comparison.txt

      - name: Upload prediction history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-history
          path: data/prediction_tracking.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload prediction tracking report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-tracking-report
          path: prediction_tracking_report.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload odds snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds-snapshot
          path: data/odds_*.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload league analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: league-analysis
          path: data/league_analysis.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload value analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: value-analysis
          path: |
            data/value_analysis.json
            value_model_report.txt
            data/value_ai_review.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            data/backtest_results.json
            backtest_report.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload model candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-candidates
          path: |
            data/model_candidates.json
            model_candidates_report.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload comparison report
        if: steps.previous.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: odds-comparison
          path: odds_comparison.txt
          if-no-files-found: warn
          retention-days: 30
