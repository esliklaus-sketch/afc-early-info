
name: AFC Intelligence AI Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import importlib.util
          import openai

          assert os.getenv("OPENAI_API_KEY"), (
              "OPENAI_API_KEY is missing"
          )

          assert importlib.util.find_spec(
              "intelligence_engine"
          ), "intelligence_engine.py is missing"

          print("API key: configured")
          print("OpenAI SDK: installed")
          print("Intelligence engine: found")
          PY

      - name: Test AI intelligence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: |
          python - <<'PY'
          from intelligence_engine import analyze_match

          evidence = """
          SKENAR HIPOTETIK:
          Ekipi A humbi 2-0.
          Luajti 85 minuta me 10 lojtare.
          Ndeshjen e kthimit e luan ne shtepi.
          Ka trajner te ri.
          Nuk kemi informacione te verifikuara
          per mungesat dhe kuotat.
          """

          result = analyze_match(
              "Analizo situaten, ndaj faktet nga "
              "hipotezat dhe identifiko cfare "
              "duhet verifikuar para ndeshjes.",
              evidence=evidence
          )

          print("=== AFC INTELLIGENCE 2.0 ===")
          print(result)

          if (
              not result
              or result.startswith("Gabim:")
              or result.startswith("Analiza AI deshtoi")
          ):
              raise SystemExit(
                  "AI test failed. Check logs."
              )

          print("AI TEST PASSED")
          PY
